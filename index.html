<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion de locations</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ================= ÉCRAN DE CHARGEMENT ================= -->
  <div id="boot" class="boot">
    <div class="spinner"></div>
  </div>

  <!-- ================= AUTHENTIFICATION ================= -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-lang">
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="ar">AR</button>
    </div>

    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">🏠</div>
        <h1 id="auth-brand-name">Gestion de locations</h1>
        <p data-i18n="auth.subtitle" class="muted">Gérez vos appartements, locations et paiements.</p>
      </div>

      <div id="setup-notice" class="notice hidden">
        <strong data-i18n="auth.setupTitle">Configuration requise</strong>
        <div data-i18n="auth.setupBody" class="small"></div>
        <code>js/config.js</code>
      </div>

      <div class="tabs">
        <button id="tab-login" class="tab active" data-i18n="auth.login">Connexion</button>
        <button id="tab-signup" class="tab" data-i18n="auth.signup">Créer un compte</button>
      </div>

      <form id="auth-form" class="auth-form" autocomplete="on">
        <div class="field" id="field-name" style="display:none">
          <label for="auth-name" data-i18n="auth.fullName">Nom complet</label>
          <input id="auth-name" type="text" autocomplete="name" placeholder="Ahmed Benali">
        </div>
        <div class="field">
          <label for="auth-email" data-i18n="auth.email">Email</label>
          <input id="auth-email" type="email" required autocomplete="email" placeholder="vous@exemple.com">
        </div>
        <div class="field">
          <label for="auth-password" data-i18n="auth.password">Mot de passe</label>
          <input id="auth-password" type="password" required autocomplete="current-password" minlength="6" placeholder="••••••••">
        </div>

        <div id="auth-message" class="alert hidden"></div>

        <button id="auth-submit" type="submit" class="btn btn-primary btn-block" data-i18n="auth.loginBtn">Se connecter</button>
      </form>

      <p class="auth-hint small muted" id="auth-hint" data-i18n="auth.firstUserHint">
        Le premier compte créé devient administrateur.
      </p>
    </div>
  </div>

  <!-- ================= APPLICATION ================= -->
  <div id="app-screen" class="app hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">🏠</div>
        <div class="sidebar-brand-text">
          <strong id="brand-name">Gestion de locations</strong>
          <span class="small muted" data-i18n="app.tagline">Locations & caisse</span>
        </div>
      </div>

      <nav id="nav" class="nav"></nav>

      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar" id="user-initials">A</div>
          <div class="user-chip-text">
            <strong id="user-name">—</strong>
            <span id="user-role" class="small muted">—</span>
          </div>
        </div>
        <button id="logout-btn" class="icon-btn" title="Déconnexion" aria-label="Déconnexion"></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" aria-label="Menu"></button>
        <h1 id="page-title" class="page-title"></h1>
        <div class="topbar-actions">
          <div class="lang-switch">
            <button class="lang-btn" data-lang="fr">FR</button>
            <button class="lang-btn" data-lang="ar">ع</button>
          </div>
        </div>
      </header>

      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/apartments.js"></script>
  <script src="js/views/clients.js"></script>
  <script src="js/views/reservations.js"></script>
  <script src="js/views/rentals.js"></script>
  <script src="js/views/payments.js"></script>
  <script src="js/views/cash.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
